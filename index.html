<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HayMedics Pharmacy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>

<style>

:root{--primary:#1E3E7B;--primary-dark:#122A54;--primary-light:#2B579E;--gold:#F4A522;--gold-dark:#E0951A;
--ink:#1f2733;--muted:#6a7690;--line:#e2e8f2;--soft:#eef2f8;--bg:#f4f6fb;--white:#fff;
--success:#22a06b;--warning:#e6a100;--danger:#e5484d;--info:#2f6fe0;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--primary);text-decoration:none}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(43,87,158,.12)}
label{display:block;font-size:12.5px;font-weight:600;color:#54607a;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13.5px;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}
.btn-gold{background:var(--gold);color:var(--primary-dark)}
.btn-light{background:var(--soft);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.grid{display:grid;gap:16px}
.spin{width:34px;height:34px;border:3px solid var(--soft);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth .hero{display:none}}
.auth .hero{background:radial-gradient(120% 100% at 15% 10%,#2B579E 0%,#1E3E7B 45%,#0E1E3C 100%);color:#fff;padding:56px 52px;display:flex;flex-direction:column;justify-content:space-between}
.auth .hero h1{font-size:2rem;font-weight:700;line-height:1.15;margin:18px 0 10px}
.auth .hero p{color:#c7d6ee;max-width:420px;line-height:1.6}
.auth .chip{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:8px 14px;border-radius:100px;font-size:12.5px;margin-top:10px;width:max-content}
.auth .panel{display:flex;align-items:center;justify-content:center;padding:40px}
.auth .card{width:min(400px,100%)}
.auth .card h2{color:var(--primary);font-size:1.5rem;margin-bottom:4px}
.auth .card .sub{color:var(--muted);margin-bottom:22px;font-size:13.5px}
.auth .field{margin-bottom:14px}
.note{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.note.err{background:#fdecec;color:#9b2c2c;border:1px solid #f7caca}
.note.ok{background:#e8f7ef;color:#1b6b4f;border:1px solid #bfe9d6}
.link{background:none;border:none;color:var(--primary);font-weight:600;font-size:13px}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:242px;background:linear-gradient(180deg,#1E3E7B,#122A54);color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:40;transition:.2s}
.side .brand{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.side .brand .lg{width:40px;height:40px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.side .brand b{font-size:15px;line-height:1.1}.side .brand span{font-size:11px;color:#b9c8e6}
.side .facility{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;color:#c7d6ee}
.side .menu{flex:1;overflow-y:auto;padding:12px 10px}
.side .mtitle{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.5);padding:12px 12px 6px;font-weight:600}
.side .mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.9);padding:11px 12px;border-radius:8px;font-size:13.5px;font-weight:500;margin-bottom:2px}
.side .mi:hover{background:rgba(255,255,255,.1)}
.side .mi.active{background:var(--gold);color:var(--primary-dark);font-weight:600}
.side .mi i{width:18px;text-align:center}
.side .logout{padding:14px;border-top:1px solid rgba(255,255,255,.1)}
.main{flex:1;margin-left:242px;min-width:0}
@media(max-width:820px){.side{left:-242px}.side.open{left:0}.main{margin-left:0}}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.top .burger{display:none;background:none;border:none;font-size:20px;color:var(--primary)}
@media(max-width:820px){.top .burger{display:block}}
.top .who{display:flex;align-items:center;gap:10px}
.top .who .av{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.wrap{padding:22px}
.page-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.page-h h1{font-size:1.4rem;color:var(--primary-dark)}
.page-h .crumb{font-size:12.5px;color:var(--muted)}

/* cards + tables */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:12px;padding:16px 18px}
.stat .v{font-size:1.7rem;font-weight:700;color:var(--primary-dark);line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat.g{border-left-color:var(--gold)}.stat.s{border-left-color:var(--success)}.stat.w{border-left-color:var(--warning)}.stat.d{border-left-color:var(--danger)}.stat.i{border-left-color:var(--info)}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-top{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbl-top .search{max-width:280px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfe}
.empty{text-align:center;color:var(--muted);padding:36px 14px}
.badge{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11.5px;font-weight:600}
.b-green{background:#e4f6ee;color:#1b7a52}.b-amber{background:#fef4e0;color:#98680a}.b-red{background:#fdeaea;color:#b3282d}.b-blue{background:#e8f0fe;color:#2559c0}.b-grey{background:#eef1f6;color:#5a6680}
.ico-btn{background:none;border:none;font-size:15px;color:var(--muted);padding:5px}
.ico-btn:hover{color:var(--primary)}
.ico-btn.del:hover{color:var(--danger)}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(18,25,45,.5);display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:min(560px,100%);box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{color:var(--primary-dark);font-size:1.1rem}
.modal-head button{background:none;border:none;font-size:24px;color:var(--muted);line-height:1}
.modal-body{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* chart */
.chart-head{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chart-head .pav{width:60px;height:60px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700}
.chart-head .meta{flex:1;min-width:200px}
.chart-head .meta h2{font-size:1.25rem;color:var(--primary-dark)}
.chart-head .meta .sub{color:var(--muted);font-size:13px;margin-top:3px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:11.5px;background:var(--soft);color:var(--primary);padding:4px 10px;border-radius:100px;font-weight:600}
.allergy-banner{background:#fdeaea;border:1px solid #f5c2c4;color:#b3282d;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:100px;font-size:13px;font-weight:600}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.soap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.soap{grid-template-columns:1fr}}
.soap .box{background:var(--soft);border-radius:10px;padding:12px}
.soap .box h5{color:var(--primary);font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.enc-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.enc-card .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item .dot{position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--line)}
.tl-item .t{font-size:12px;color:var(--muted)}

/* POS */
.pos-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:16px;align-items:start}
@media(max-width:900px){.pos-grid{grid-template-columns:1fr}}
.pos-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:64vh;overflow:auto}
@media(max-width:1200px){.pos-list{grid-template-columns:1fr}}
.pos-item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.12s;width:100%}
.pos-item:hover{border-color:var(--primary-light);box-shadow:0 6px 16px rgba(26,20,100,.08)}
.pos-item.oos{opacity:.5;cursor:not-allowed}
.cart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:78px}
.cart h3{color:var(--primary-dark);font-size:1.05rem;margin-bottom:10px}
.cart-lines{max-height:34vh;overflow:auto;margin-bottom:10px}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--soft)}
.cart-tot .row{display:flex;justify-content:space-between;align-items:center;margin:7px 0;font-size:13.5px}
.cart-tot .row.big{font-size:17px;color:var(--primary-dark);border-top:1px dashed var(--line);padding-top:8px;font-weight:700}
/* print */
#hm-print{display:none}
#hm-print .rcpt{font-family:Arial,sans-serif;max-width:320px;margin:0 auto;color:#000}
@media print{ body{background:#fff} #root{display:none!important} #hm-print{display:block!important} }

</style>
